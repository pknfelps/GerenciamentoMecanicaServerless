name: serverless-deploy
run-name: serverless-deploy / ${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }} / ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Develop/hom ou main/prd
        required: true
        default: hom
        type: choice
        options: [hom, prd]

permissions: {}
concurrency:
  group: serverless-deploy-${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }}
  cancel-in-progress: false

jobs:
  publish-email:
    uses: ./.github/workflows/reusable-publish.yml
    concurrency:
      group: email-${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      component: email
      environment: ${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }}

  provision-email:
    needs: publish-email
    uses: ./.github/workflows/reusable-provision.yml
    concurrency:
      group: email-${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      component: email
      environment: ${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }}
      artifact_commit: ${{ github.sha }}

  publish-auth:
    uses: ./.github/workflows/reusable-publish.yml
    concurrency:
      group: auth-${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      component: auth
      environment: ${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }}

  provision-auth:
    needs: [publish-auth, provision-email]
    uses: ./.github/workflows/reusable-provision.yml
    concurrency:
      group: auth-${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      component: auth
      environment: ${{ inputs.environment || (github.ref_name == 'develop' && 'hom' || 'prd') }}
      artifact_commit: ${{ github.sha }}
